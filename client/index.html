<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SemSync — Layer 1 demo</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 720px;
        margin: 40px auto;
        padding: 0 16px;
        color: #1a1a1a;
      }
      h1 { font-size: 1.3rem; }
      #status {
        font-size: 0.85rem;
        padding: 6px 10px;
        border-radius: 6px;
        display: inline-block;
        margin-bottom: 12px;
        background: #eee;
      }
      #status.connected { background: #d7f5dd; color: #146c2e; }
      #status.disconnected { background: #fde2e2; color: #9c1c1c; }
      textarea {
        width: 100%;
        height: 260px;
        font-size: 1rem;
        font-family: ui-monospace, monospace;
        padding: 12px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 8px;
      }
      #docId {
        font-size: 0.75rem;
        color: #666;
        word-break: break-all;
      }
      p.hint { font-size: 0.85rem; color: #555; }
    </style>
  </head>
  <body>
    <h1>SemSync — Layer 1 (CRDT Replication) demo</h1>
    <div id="status">connecting…</div>
    <p class="hint">
      Open this same URL in a second tab (or paste the URL including the
      <code>#doc=...</code> part into another browser) and type in either
      one. Both will converge — that's Automerge's CRDT engine plus the
      WebSocket broadcast doing their job.
    </p>
    <textarea id="editor" placeholder="Start typing…"></textarea>
    <p id="docId"></p>
    <script type="module" src="/client.js"></script>
  </body>
</html>
