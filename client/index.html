<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SemSync Layer 1 Prototype</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        max-width: 720px;
        margin: 40px auto;
        padding: 0 16px;
        color: #212529;
        line-height: 1.5;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 16px 0;
      }
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
        gap: 12px;
      }
      #status {
        font-size: 0.8rem;
        padding: 4px 8px;
        border-radius: 4px;
        display: inline-block;
        border: 1px solid #ced4da;
        background: #f8f9fa;
        color: #495057;
      }
      #status.connected {
        background: #e6f4ea;
        border-color: #b7e1cd;
        color: #137333;
      }
      #status.disconnected {
        background: #fce8e6;
        border-color: #fad2cf;
        color: #c5221f;
      }
      #status.paused {
        background: #fef7e0;
        border-color: #feefc3;
        color: #b06000;
      }
      .btn {
        padding: 5px 12px;
        cursor: pointer;
        border-radius: 4px;
        border: 1px solid #ced4da;
        background: #ffffff;
        font-size: 0.8rem;
        font-family: inherit;
        color: #212529;
      }
      .btn:hover {
        background: #f1f3f5;
      }
      .btn-active {
        background: #1a73e8;
        border-color: #1a73e8;
        color: #ffffff;
      }
      .btn-active:hover {
        background: #1765cc;
      }
      .presets {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
        font-size: 0.8rem;
        color: #6c757d;
      }
      .preset-btn {
        font-size: 0.75rem;
        padding: 3px 8px;
        border: 1px solid #dee2e6;
        background: #ffffff;
        border-radius: 3px;
        cursor: pointer;
        font-family: inherit;
        color: #495057;
      }
      .preset-btn:hover {
        background: #f8f9fa;
        border-color: #ced4da;
      }
      textarea {
        width: 100%;
        height: 260px;
        font-size: 0.95rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        padding: 12px;
        box-sizing: border-box;
        border: 1px solid #ced4da;
        border-radius: 4px;
        outline: none;
        resize: vertical;
      }
      textarea:focus {
        border-color: #80bdff;
      }
      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 10px;
        gap: 12px;
        background: #f8f9fa;
        padding: 8px 12px;
        border-radius: 4px;
        border: 1px solid #e9ecef;
      }
      #docId {
        font-size: 0.75rem;
        color: #6c757d;
        font-family: monospace;
        margin: 0;
        word-break: break-all;
      }
      p.instructions {
        font-size: 0.8rem;
        color: #6c757d;
        margin: 0 0 12px 0;
      }
    </style>
  </head>
  <body>
    <h1>SemSync: Prototype</h1>

    <div class="toolbar">
      <div id="status">Connecting...</div>
      <button id="offlineBtn" class="btn">Pause Sync</button>
    </div>

    <div class="presets">
      <span>Load Scenario:</span>
      <button id="presetDemand" class="preset-btn">Market Demand</button>
      <button id="presetFox" class="preset-btn">The Brown Fox</button>
    </div>

    <p class="instructions">
      Open in two tabs to test real-time sync. Use "Pause Sync" on one tab to simulate offline edits, modify both tabs, and click "Resume Sync" to test concurrent merging.
    </p>

    <textarea id="editor" placeholder="Start typing..."></textarea>

    <div class="footer">
      <p id="docId"></p>
      <button id="copyBtn" class="btn">Copy Document Link</button>
    </div>

    <script type="module" src="/client.js"></script>
  </body>
</html>
